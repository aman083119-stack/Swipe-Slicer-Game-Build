<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Swipe Slicer — Combo Forge</title>
<!-- YouTube Playables SDK — MUST be first -->
<script src="https://www.youtube.com/game_api/v1"></script>
<style>
  :root{--bg:#080810;--panel:rgba(12,12,24,.78);--border:rgba(255,255,255,.14);--accent:#ffd447;--danger:#ff4466}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Inter','Segoe UI',system-ui,sans-serif;touch-action:none;cursor:crosshair}
  #gameCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:16px;padding:10px 16px;color:#fff;text-align:center;min-width:92px}
  .label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.55);margin-bottom:2px}
  .value{font-size:28px;font-weight:800;line-height:1;letter-spacing:.5px}
  .sub{font-size:10px;color:rgba(255,255,255,.45);margin-top:4px}
  #lives{display:flex;gap:7px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:10px 14px}
  .life{width:14px;height:14px;border-radius:50%;background:var(--danger);box-shadow:0 0 12px rgba(255,68,102,.8);transition:.28s}
  .life.lost{background:#2a2a2a;box-shadow:none;opacity:.35;transform:scale(.65)}
  #comboMeter{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:12;pointer-events:none;display:none;text-align:center;color:#fff}
  #comboMeter .streak{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.55)}
  #comboMeter .mult{font-size:24px;font-weight:900;color:var(--accent);text-shadow:0 0 24px rgba(255,212,71,.7)}
  #toast{position:fixed;top:46%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:20;pointer-events:none;font-size:34px;font-weight:900;color:var(--accent);text-shadow:0 0 30px rgba(255,200,50,.9),0 0 60px rgba(255,150,0,.5);transition:transform .14s cubic-bezier(.175,.885,.32,1.275);white-space:nowrap}
  #toast.show{transform:translate(-50%,-50%) scale(1)}
  #toast.mega{color:#ff66aa;text-shadow:0 0 30px rgba(255,100,170,.9),0 0 60px rgba(255,50,120,.5);font-size:42px}
  #themeBadge{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.65);text-transform:uppercase}
  @media (max-width:640px){.value{font-size:22px}.panel{padding:8px 12px;min-width:76px}#toast{font-size:26px}#toast.mega{font-size:32px}}
</style>
</head>
<body>
<canvas id="gameCanvas" aria-label="Swipe Slicer game canvas"></canvas>

<div id="hud">
  <div class="panel">
    <div class="label">Score</div>
    <div class="value" id="scoreVal">0</div>
    <div class="sub" id="bestVal">Best: 0</div>
  </div>
  <div id="lives" aria-label="Lives remaining">
    <div class="life" id="life0"></div>
    <div class="life" id="life1"></div>
    <div class="life" id="life2"></div>
  </div>
</div>

<div id="comboMeter">
  <div class="streak" id="streakLabel">STREAK x0</div>
  <div class="mult" id="multLabel">1×</div>
</div>

<div id="toast"></div>
<div id="themeBadge"></div>

<script>
/* =========================================================================
   SWIPE SLICER — COMBO FORGE
   YouTube Playables–ready build (no monetization)
   ========================================================================= */
(function () {
  'use strict';

  /* ----------------------------- SDK LAYER ----------------------------- */
  const YT = (typeof ytgame !== 'undefined') ? ytgame : null;
  const IN_PLAYABLES = !!(YT && YT.IN_PLAYABLES_ENV);
  const SAVE_KEY = 'swipeSlicer_save_v2';

  let audioEnabled = true;
  let isPaused = false;
  let firstFrameSent = false;
  let gameReadySent = false;
  let bestScore = 0;
  let lastSavedBest = 0;

  function initAudioState() {
    if (!YT?.system) return;
    try {
      if (typeof YT.system.isAudioEnabled === 'function') audioEnabled = YT.system.isAudioEnabled();
      if (typeof YT.system.onAudioEnabledChange === 'function') {
        YT.system.onAudioEnabledChange((on) => {
          audioEnabled = !!on;
          if (audioCtx) {
            if (!on && audioCtx.state === 'running') audioCtx.suspend().catch(() => {});
            if (on && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
          }
        });
      }
    } catch (_) {}
  }

  function initPauseHandlers() {
    if (!YT?.system) return;
    try {
      if (typeof YT.system.onPause === 'function') {
        YT.system.onPause(() => {
          isPaused = true;
          isSwiping = false;
          currentPath = [];
          slicedThisSwipe = [];
          persistBest();
          if (audioCtx?.state === 'running') audioCtx.suspend().catch(() => {});
        });
      }
      if (typeof YT.system.onResume === 'function') {
        YT.system.onResume(() => {
          isPaused = false;
          if (audioEnabled && audioCtx?.state === 'suspended') audioCtx.resume().catch(() => {});
        });
      }
    } catch (_) {}
  }

  async function loadBest() {
    try {
      let raw = null;
      if (IN_PLAYABLES && YT.game?.loadData) raw = await YT.game.loadData();
      else raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (typeof d.bestScore === 'number' && isFinite(d.bestScore)) {
          bestScore = Math.max(0, Math.floor(d.bestScore));
          lastSavedBest = bestScore;
        }
      }
    } catch (_) {
      try { YT?.health?.logWarning?.(); } catch (_) {}
    }
    updateBestUI();
  }

  async function persistBest() {
    if (bestScore === lastSavedBest) return;
    lastSavedBest = bestScore;
    try {
      const payload = JSON.stringify({ bestScore: Math.floor(bestScore) });
      if (IN_PLAYABLES && YT.game?.saveData) await YT.game.saveData(payload);
      else localStorage.setItem(SAVE_KEY, payload);
    } catch (_) {
      try { YT?.health?.logWarning?.(); } catch (_) {}
    }
  }

  async function sendScore(v) {
    if (!IN_PLAYABLES || !YT.engagement?.sendScore) return;
    try { await YT.engagement.sendScore({ value: Math.floor(v) }); }
    catch (_) { try { YT?.health?.logError?.(); } catch (_) {} }
  }

  async function initLanguage() {
    if (!YT?.system?.getLanguage) return;
    try {
      const lang = await YT.system.getLanguage();
      if (lang) document.documentElement.lang = lang;
    } catch (_) {}
  }

  /* ----------------------------- DOM ----------------------------- */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const scoreVal = document.getElementById('scoreVal');
  const bestVal = document.getElementById('bestVal');
  const lifeEls = [0, 1, 2].map(i => document.getElementById('life' + i));
  const toast = document.getElementById('toast');
  const themeBadge = document.getElementById('themeBadge');
  const comboMeter = document.getElementById('comboMeter');
  const streakLabel = document.getElementById('streakLabel');
  const multLabel = document.getElementById('multLabel');

  /* ----------------------------- THEME ----------------------------- */
  const THEMES = [
    { name: 'Basic Geometry', shapes: ['circle', 'square', 'triangle'] },
    { name: 'Crystal Forms', shapes: ['diamond', 'pentagon', 'hexagon'] },
    { name: 'Celestial', shapes: ['star', 'circle', 'diamond'] },
    { name: 'Angular', shapes: ['square', 'triangle', 'hexagon'] },
    { name: 'Rounded & Pointed', shapes: ['circle', 'pentagon', 'star'] },
    { name: 'Sharp Edges', shapes: ['triangle', 'diamond', 'hexagon'] },
    { name: 'Variety Pack', shapes: ['circle', 'square', 'pentagon', 'star'] },
  ];
  const daily = THEMES[new Date().getDate() % THEMES.length];
  const SHAPES = daily.shapes;
  themeBadge.textContent = 'Today · ' + daily.name;

  /* ----------------------------- CONSTANTS ----------------------------- */
  const COLORS = ['#FF4D5A', '#3DDC84', '#4DA3FF', '#FF9F1C', '#E84DFF', '#00D9C0', '#FFD447', '#FF7A9E'];
  const BOMB_COLOR = '#181818';
  const BOMB_ACCENT = '#FF3B3B';
  const GRAVITY = 0.5;
  const BASE_SCORE = 10;
  const MAX_MISSES = 3;
  const SHAPE_R = 28;
  const BOMB_R = 32;
  const MAX_PARTICLES = 260;

  /* ----------------------------- STATE ----------------------------- */
  let shapes = [], particles = [], texts = [], trails = [];
  let score = 0, misses = 0;
  let gameState = 'MENU';
  let isSwiping = false, currentPath = [], slicedThisSwipe = [];
  let spawnTimer = 0, difficulty = 1, bombChance = 0.08;
  let shake = 0, shakeAngle = 0;
  let toastTimer = 0, menuPulse = 0, frame = 0;
  let comboStreak = 0;
  let shieldActive = false;
  let slowMo = 0;
  let hitStop = 0;
  let W = 0, H = 0, DPR = 1;

  /* ----------------------------- AUDIO ----------------------------- */
  let audioCtx = null;
  function initAudio() {
    if (!audioEnabled) return;
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { audioCtx = null; }
    }
    if (audioCtx?.state === 'suspended') audioCtx.resume().catch(() => {});
  }
  function beep(freq, dur, type = 'square', vol = 0.05) {
    if (!audioEnabled || !audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * 0.3), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur);
    } catch (_) {}
  }
  const sfx = {
    slice: () => { beep(820, 0.07, 'square', 0.045); beep(1240, 0.04, 'square', 0.028); },
    combo: (n) => { const b = 560 + n * 130; beep(b, 0.09, 'square', 0.06); setTimeout(() => beep(b * 1.5, 0.07, 'square', 0.04), 55); },
    bomb: () => { beep(45, 0.38, 'sawtooth', 0.14); beep(28, 0.5, 'triangle', 0.1); },
    miss: () => beep(160, 0.18, 'triangle', 0.035),
    power: () => { beep(660, 0.08, 'sine', 0.06); beep(990, 0.12, 'sine', 0.05); },
  };

  /* ----------------------------- RESIZE (Playables-compliant) ----------------------------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(DPR, DPR);
    ctx.imageSmoothingEnabled = true;
  }
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(resize, 80), { passive: true });
  resize();

  /* ----------------------------- UTILS ----------------------------- */
  function eventPos(e) {
    const r = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - r.left, y: cy - r.top };
  }

  function distSeg(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    if (l2 === 0) return Math.hypot(px - ax, py - ay);
    let t = ((px - ax) * dx + (py - ay) * dy) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }

  function lighten(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    return `rgb(${Math.min(255, (n >> 16) + amt)},${Math.min(255, ((n >> 8) & 0x00FF00) + amt)},${Math.min(255, (n & 0x0000FF) + amt)})`;
  }
  function darken(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    return `rgb(${Math.max(0, (n >> 16) - amt)},${Math.max(0, ((n >> 8) & 0x00FF00) - amt)},${Math.max(0, (n & 0x0000FF) - amt)})`;
  }

  /* ----------------------------- SHAPES ----------------------------- */
  class Shape {
    constructor(x, y, vx, vy, color, type, bomb = false) {
      this.x = x; this.y = y; this.vx = vx; this.vy = vy;
      this.color = color; this.type = type; this.bomb = bomb;
      this.r = bomb ? BOMB_R : SHAPE_R;
      this.rot = Math.random() * Math.PI * 2;
      this.rotSpd = (Math.random() - 0.5) * 0.06;
      this.sliced = false; this.scored = false; this.alive = true;
      this.squash = 1;
    }
    update(dt) {
      if (!this.alive) return;
      this.vy += GRAVITY * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.rot += this.rotSpd * dt;
      this.squash += (1 - this.squash) * 0.15;
    }
    below(h) { return this.y > h + 40; }
    off(w, h) { return this.y > h + 100 || this.y < -240 || this.x < -140 || this.x > w + 140; }
  }

  class Particle {
    constructor(x, y, vx, vy, color, size, life) {
      this.x = x; this.y = y; this.vx = vx; this.vy = vy;
      this.color = color; this.size = size; this.life = life; this.max = life; this.alive = true;
    }
    update(dt) {
      this.life -= dt;
      if (this.life <= 0) { this.alive = false; return; }
      this.vy += GRAVITY * 0.55 * dt;
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.size *= 0.986;
    }
    alpha() { return Math.max(0, this.life / this.max); }
  }

  class FloatText {
    constructor(x, y, txt, color, life = 50) {
      this.x = x; this.y = y; this.txt = txt; this.color = color;
      this.life = life; this.max = life; this.alive = true;
    }
    update(dt) {
      this.life -= dt;
      if (this.life <= 0) { this.alive = false; return; }
      this.y -= 1.9 * dt;
    }
    alpha() { return Math.max(0, this.life / this.max); }
  }

  class Trail {
    constructor(pts) { this.pts = [...pts]; this.age = 0; this.max = 34; this.alive = true; }
    update(dt) { this.age += dt; if (this.age >= this.max) this.alive = false; }
    alpha() { return Math.max(0, 1 - this.age / this.max); }
  }

  /* ----------------------------- SPAWN ----------------------------- */
  function spawnWave() {
    const count = 1 + Math.floor(Math.random() * (2 + Math.min(difficulty, 4)));
    const baseX = W * 0.15 + Math.random() * W * 0.7;
    for (let i = 0; i < count; i++) {
      const sx = Math.max(44, Math.min(W - 44, baseX + (Math.random() - 0.5) * W * 0.5));
      const sy = H + 20 + Math.random() * 60;
      const vx = (Math.random() - 0.5) * 7;
      const vy = -(14 + Math.random() * 10 + difficulty * 0.8);
      const bomb = Math.random() < bombChance;
      const color = bomb ? BOMB_COLOR : COLORS[Math.floor(Math.random() * COLORS.length)];
      const type = bomb ? 'bomb' : SHAPES[Math.floor(Math.random() * SHAPES.length)];
      shapes.push(new Shape(sx, sy, vx, vy, color, type, bomb));
    }

    // same-color cluster
    if (Math.random() < 0.3) {
      const c = COLORS[Math.floor(Math.random() * COLORS.length)];
      const t = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      const cx = W * 0.2 + Math.random() * W * 0.6;
      const cy = H + 30;
      const n = 2 + Math.floor(Math.random() * 3);
      const baseVy = -(15 + Math.random() * 8);
      for (let j = 0; j < n; j++) {
        shapes.push(new Shape(cx + (j - (n - 1) / 2) * 54, cy + j * 18,
          (Math.random() - 0.5) * 2, baseVy - j * 2, c, t, false));
      }
    }

    // power-up drop (rare)
    if (Math.random() < 0.06 && !shieldActive) {
      shapes.push(new Shape(W * 0.2 + Math.random() * W * 0.6, H + 30,
        (Math.random() - 0.5) * 3, -(12 + Math.random() * 6),
        '#66D9FF', 'shield', false));
    }
    if (Math.random() < 0.04 && slowMo <= 0) {
      shapes.push(new Shape(W * 0.2 + Math.random() * W * 0.6, H + 30,
        (Math.random() - 0.5) * 3, -(12 + Math.random() * 6),
        '#C77DFF', 'slow', false));
    }
  }

  /* ----------------------------- SLICING ----------------------------- */
  function sliceShape(s) {
    if (s.bomb) { explodeBomb(s); return; }

    if (s.type === 'shield') {
      shieldActive = true;
      s.squash = 0.3;
      sfx.power();
      texts.push(new FloatText(s.x, s.y, '🛡️ Shield!', '#66D9FF', 60));
      burst(s.x, s.y, '#66D9FF', 16);
      return;
    }
    if (s.type === 'slow') {
      slowMo = 90; // frames
      s.squash = 0.3;
      sfx.power();
      texts.push(new FloatText(s.x, s.y, '⏳ Slow-Mo!', '#C77DFF', 60));
      burst(s.x, s.y, '#C77DFF', 16);
      return;
    }

    s.squash = 0.4;
    burst(s.x, s.y, s.color, 12 + Math.floor(Math.random() * 8));
    sfx.slice();
    slicedThisSwipe.push({ shape: s, color: s.color });
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      if (particles.length >= MAX_PARTICLES) break;
      const a = Math.random() * Math.PI * 2;
      const sp = 3 + Math.random() * 7;
      particles.push(new Particle(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 3,
        color, 3 + Math.random() * 5, 24 + Math.random() * 24));
    }
    for (let i = 0; i < 4; i++) {
      if (particles.length >= MAX_PARTICLES) break;
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 4;
      particles.push(new Particle(x, y, Math.cos(a) * sp, Math.sin(a) * sp,
        '#ffffff', 1.4 + Math.random() * 2, 10 + Math.random() * 14));
    }
  }

  function explodeBomb(b) {
    burst(b.x, b.y, BOMB_ACCENT, 30);
    burst(b.x, b.y, '#FF9F1C', 20);
    shake = 22;
    shakeAngle = Math.random() * Math.PI * 2;
    hitStop = 10;
    sfx.bomb();
    endRun('bomb');
  }

  /* ----------------------------- END RUN ----------------------------- */
  function endRun(reason) {
    gameState = 'OVER';
    shapes.forEach(s => { if (!s.sliced) s.alive = false; });
    const msg = reason === 'bomb' ? '💥 Bomb Slashed!' : '💔 Out of Lives!';
    texts.push(new FloatText(W / 2, H / 2 - 50, msg, '#FF4466', 110));
    texts.push(new FloatText(W / 2, H / 2 + 5, 'Swipe to Retry', '#fff', 110));
    texts.push(new FloatText(W / 2, H / 2 + 50, `Score ${score}`, '#FFD447', 110));

    if (score > bestScore) bestScore = score;
    updateBestUI();
    persistBest();
    sendScore(score);
    updateLivesUI();
    comboMeter.style.display = 'none';
  }

  /* ----------------------------- COMBO ----------------------------- */
  function resolveSwipe() {
    if (!slicedThisSwipe.length) return;

    const groups = new Map();
    for (const it of slicedThisSwipe) {
      if (!groups.has(it.color)) groups.set(it.color, []);
      groups.get(it.color).push(it.shape);
    }

    let gained = 0, best = 0;

    for (const [color, arr] of groups) {
      const n = arr.length;
      const mult = n >= 2 ? n : 1;
      const pts = n * BASE_SCORE * mult;
      gained += pts;
      if (n >= 2 && n > best) best = n;

      if (n >= 2) {
        const ax = arr.reduce((s, g) => s + g.x, 0) / n;
        const ay = arr.reduce((s, g) => s + g.y, 0) / n;
        const lbl = n >= 5 ? 'ULTRA!' : n >= 4 ? 'MEGA!' : n >= 3 ? 'TRIPLE!' : 'DOUBLE!';
        texts.push(new FloatText(ax, ay - 12, `${lbl} ${n}×`, color, 56));
        texts.push(new FloatText(ax, ay + 14, `+${pts}`, '#FFD447', 50));
      } else {
        texts.push(new FloatText(arr[0].x, arr[0].y - 4, `+${BASE_SCORE}`, color, 34));
      }
    }

    score += gained;

    if (best >= 2) {
      comboStreak++;
      if (best >= 4) shake = Math.max(shake, 6);
      showToast(best);
      sfx.combo(best);
      updateComboMeter(best);
    } else {
      comboStreak = 0;
      comboMeter.style.display = 'none';
    }

    updateScoreUI();
    slicedThisSwipe = [];
  }

  function showToast(n) {
    let text, cls;
    if (n >= 5) { text = `🔥 ULTRA x${n}!`; cls = 'mega'; }
    else if (n >= 4) { text = `✨ MEGA x${n}!`; cls = 'mega'; }
    else if (n >= 3) { text = `⚡ TRIPLE x${n}!`; cls = ''; }
    else { text = `🎯 DOUBLE x${n}!`; cls = ''; }

    toast.textContent = text;
    toast.className = 'show ' + cls;
    toastTimer = 38;
    texts.push(new FloatText(W / 2, H * 0.38, text, '#FFD447', 52));
  }

  function updateComboMeter(best) {
    comboMeter.style.display = 'block';
    streakLabel.textContent = `STREAK ×${comboStreak}`;
    multLabel.textContent = `${best}×`;
  }

  /* ----------------------------- UI ----------------------------- */
  function updateScoreUI() { scoreVal.textContent = score; }
  function updateBestUI() { bestVal.textContent = 'Best: ' + bestScore; }
  function updateLivesUI() {
    lifeEls.forEach((el, i) => el.classList.toggle('lost', i >= MAX_MISSES - misses));
  }

  /* ----------------------------- UPDATE ----------------------------- */
  function update(dt) {
    frame++;

    if (hitStop > 0) { hitStop -= dt; return; }

    if (gameState === 'PLAYING') {
      const speed = slowMo > 0 ? 0.45 : 1;
      if (slowMo > 0) slowMo -= dt;

      spawnTimer += dt;
      const interval = Math.max(22, 55 - difficulty * 3);
      if (spawnTimer >= interval) {
        spawnTimer = 0;
        spawnWave();
        if (frame % 600 === 0) {
          difficulty = Math.min(8, difficulty + 1);
          bombChance = Math.min(0.2, 0.08 + difficulty * 0.015);
        }
      }

      for (const s of shapes) s.update(dt * speed);

      for (const s of shapes) {
        if (s.below(H) && !s.sliced && s.alive) {
          if (!s.bomb && !s.scored) {
            s.scored = true;
            if (shieldActive) {
              shieldActive = false;
              texts.push(new FloatText(s.x, H - 40, '🛡️ Blocked!', '#66D9FF', 45));
              sfx.power();
            } else {
              misses++;
              sfx.miss();
              texts.push(new FloatText(s.x, H - 30, 'MISS', '#FF4466', 38));
              shake = Math.max(shake, 4);
              updateLivesUI();
              if (misses >= MAX_MISSES) endRun('misses');
            }
          }
          s.alive = false;
        }
        if (s.off(W, H)) s.alive = false;
      }

      shapes = shapes.filter(s => s.alive);
    }

    for (const p of particles) p.update(dt);
    particles = particles.filter(p => p.alive);

    for (const t of texts) t.update(dt);
    texts = texts.filter(t => t.alive);

    for (const tr of trails) tr.update(dt);
    trails = trails.filter(t => t.alive);

    if (shake > 0) shake *= 0.86;
    if (shake < 0.3) shake = 0;

    if (toastTimer > 0) {
      toastTimer -= dt;
      if (toastTimer <= 0) { toast.className = ''; toast.textContent = ''; }
    }

    menuPulse += 0.045 * dt;
  }

  /* ----------------------------- DRAW ----------------------------- */
  function draw() {
    let sx = 0, sy = 0;
    if (shake > 0) {
      sx = Math.cos(shakeAngle) * shake * 2;
      sy = Math.sin(shakeAngle) * shake * 2;
    }

    ctx.save();
    ctx.translate(sx, sy);

    drawBackground();

    for (const s of shapes) drawShape(s);

    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = p.alpha();
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      if (p.size > 2.2) {
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    drawTrails();
    drawTexts();

    if (slowMo > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(90,60,160,.10)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    ctx.restore();

    if (gameState === 'MENU') drawMenu();
    else if (gameState === 'OVER') drawOver();
  }

  function drawBackground() {
    const g = ctx.createRadialGradient(W / 2, H * 0.35, H * 0.08, W / 2, H / 2, H * 1.15);
    g.addColorStop(0, '#141432');
    g.addColorStop(0.5, '#0A0A18');
    g.addColorStop(1, '#040408');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(255,255,255,.03)';
    ctx.lineWidth = 0.5;
    for (let x = 56; x < W; x += 56) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 56; y < H; y += 56) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    ctx.fillStyle = 'rgba(255,255,255,.045)';
    for (let i = 0; i < 26; i++) {
      const px = (i * 143 + 42) % W;
      const py = ((i * 257 + 126 + frame * 0.28) % (H + 90)) - 45;
      ctx.beginPath(); ctx.arc(px, py, 1 + (i % 3), 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawShape(s) {
    if (!s.alive && s.sliced) return;
    const { x, y, r, color, type, rot, bomb, squash } = s;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(1 + (1 - squash) * 0.2, squash);

    if (bomb) drawBomb(r);
    else if (type === 'shield' || type === 'slow') drawPower(r, type);
    else drawPoly(type, r, color);

    ctx.restore();

    if (bomb) {
      ctx.save();
      ctx.globalAlpha = 0.22 + Math.sin(frame * 0.15) * 0.14;
      const g = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 1.7);
      g.addColorStop(0, BOMB_ACCENT);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r * 1.7, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawBomb(r) {
    const g = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#444');
    g.addColorStop(0.7, '#1A1A1A');
    g.addColorStop(1, '#000');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = BOMB_ACCENT; ctx.lineWidth = 3; ctx.stroke();

    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ctx.strokeStyle = BOMB_ACCENT; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 0.85, Math.sin(a) * r * 0.85);
      ctx.lineTo(Math.cos(a) * r * 1.35, Math.sin(a) * r * 1.35);
      ctx.stroke();
    }

    ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.75);
    ctx.quadraticCurveTo(r * 0.6, -r * 1.3, r * 0.3, -r * 1.1);
    ctx.stroke();

    const a = 0.5 + Math.sin(frame * 0.5) * 0.5;
    ctx.fillStyle = `rgba(255,200,50,${a})`;
    ctx.beginPath(); ctx.arc(r * 0.3, -r * 1.1, 4, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = BOMB_ACCENT; ctx.lineWidth = 2;
    const ir = r * 0.4;
    ctx.beginPath();
    ctx.moveTo(-ir, -ir); ctx.lineTo(ir, ir);
    ctx.moveTo(ir, -ir); ctx.lineTo(-ir, ir);
    ctx.stroke();
  }

  function drawPower(r, type) {
    const isShield = type === 'shield';
    const main = isShield ? '#66D9FF' : '#C77DFF';
    const g = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r);
    g.addColorStop(0, lighten(main, 50));
    g.addColorStop(1, darken(main, 40));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(r * 0.9)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isShield ? '🛡' : '⏳', 0, 1);
  }

  function drawPoly(type, r, color) {
    const g = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.05, 0, 0, r);
    g.addColorStop(0, lighten(color, 45));
    g.addColorStop(0.7, color);
    g.addColorStop(1, darken(color, 35));
    ctx.fillStyle = g;
    ctx.strokeStyle = 'rgba(255,255,255,.28)';
    ctx.lineWidth = 2;

    ctx.beginPath();
    switch (type) {
      case 'circle': ctx.arc(0, 0, r, 0, Math.PI * 2); break;
      case 'square': ctx.rect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7); break;
      case 'triangle':
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.87, r * 0.5);
        ctx.lineTo(-r * 0.87, r * 0.5);
        ctx.closePath(); break;
      case 'diamond':
        ctx.moveTo(0, -r); ctx.lineTo(r * 0.75, 0);
        ctx.lineTo(0, r); ctx.lineTo(-r * 0.75, 0);
        ctx.closePath(); break;
      case 'pentagon': polyPath(5, r); break;
      case 'hexagon': polyPath(6, r); break;
      case 'star': starPath(5, r * 0.95, r * 0.4); break;
      default: ctx.arc(0, 0, r, 0, Math.PI * 2);
    }
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.beginPath(); ctx.arc(-r * 0.2, -r * 0.3, r * 0.34, 0, Math.PI * 2); ctx.fill();
  }

  function polyPath(sides, r) {
    ctx.moveTo(0, -r);
    for (let i = 1; i < sides; i++) {
      const a = (i / sides) * Math.PI * 2 - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
  }
  function starPath(pts, ro, ri) {
    const step = Math.PI / pts;
    ctx.moveTo(0, -ro);
    for (let i = 0; i < pts * 2; i++) {
      const r = i % 2 === 0 ? ro : ri;
      const a = i * step - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
  }

  function drawTrails() {
    for (const t of trails) {
      if (t.pts.length < 2) continue;
      const a = t.alpha();
      if (a <= 0) continue;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(t.pts[0].x, t.pts[0].y);
      for (let i = 1; i < t.pts.length; i++) ctx.lineTo(t.pts[i].x, t.pts[i].y);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(t.pts[0].x, t.pts[0].y);
      for (let i = 1; i < t.pts.length; i++) ctx.lineTo(t.pts[i].x, t.pts[i].y);
      ctx.stroke();
      ctx.restore();
    }

    if (isSwiping && currentPath.length >= 2) {
      ctx.save();
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.moveTo(currentPath[0].x, currentPath[0].y);
      for (let i = 1; i < currentPath.length; i++) ctx.lineTo(currentPath[i].x, currentPath[i].y);
      ctx.stroke();

      const lg = ctx.createLinearGradient(
        currentPath[0].x, currentPath[0].y,
        currentPath[currentPath.length - 1].x, currentPath[currentPath.length - 1].y);
      lg.addColorStop(0, 'rgba(255,255,255,.45)');
      lg.addColorStop(1, 'rgba(255,255,255,.95)');
      ctx.strokeStyle = lg; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(currentPath[0].x, currentPath[0].y);
      for (let i = 1; i < currentPath.length; i++) ctx.lineTo(currentPath[i].x, currentPath[i].y);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawTexts() {
    for (const t of texts) {
      ctx.save();
      ctx.globalAlpha = t.alpha();
      ctx.fillStyle = t.color;
      ctx.font = 'bold 16px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,.5)';
      ctx.shadowBlur = 4;
      ctx.fillText(t.txt, t.x, t.y);
      ctx.restore();
    }
  }

  function drawMenu() {
    ctx.fillStyle = 'rgba(4,4,12,.62)';
    ctx.fillRect(0, 0, W, H);

    const ty = H * 0.34;
    const pulse = 1 + Math.sin(menuPulse) * 0.04;

    ctx.save();
    ctx.translate(W / 2, ty);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold clamp(34px,8vw,52px) Inter, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(255,255,255,.45)'; ctx.shadowBlur = 22;
    ctx.fillText('Swipe Slicer', 0, 0);
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,.72)';
    ctx.font = '16px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Slice same-color chains · build combos', W / 2, ty + 44);

    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.font = '13px Inter, system-ui, sans-serif';
    ctx.fillText('Today · ' + daily.name, W / 2, ty + 72);

    const iy = H * 0.58;
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.font = '15px Inter, system-ui, sans-serif';
    ctx.fillText('🖐️ Swipe through shapes to slice', W / 2, iy);
    ctx.fillText('🎯 Same color in one swipe = combo', W / 2, iy + 30);
    ctx.fillText('💣 Avoid bombs · ❤️❤️❤️ 3 misses = over', W / 2, iy + 60);
    ctx.fillText('🛡️ Shield & ⏳ Slow-Mo power-ups', W / 2, iy + 90);

    const pa = 0.5 + Math.sin(menuPulse * 1.4) * 0.35;
    ctx.fillStyle = `rgba(255,255,255,${pa})`;
    ctx.font = 'bold 20px Inter, system-ui, sans-serif';
    ctx.fillText('Swipe anywhere to start', W / 2, H * 0.8);

    const deco = ['circle', 'square', 'triangle', 'diamond', 'star'];
    for (let i = 0; i < 5; i++) {
      const dx = W * 0.12 + i * W * 0.19;
      const dy = H * 0.18 + Math.sin(menuPulse + i) * 14;
      ctx.save();
      ctx.translate(dx, dy);
      ctx.rotate(menuPulse * 0.5 + i);
      ctx.globalAlpha = 0.45;
      drawPoly(deco[i], 22, COLORS[i % COLORS.length]);
      ctx.restore();
    }
  }

  function drawOver() {
    ctx.fillStyle = 'rgba(4,4,12,.72)';
    ctx.fillRect(0, 0, W, H);

    const cy = H * 0.4;
    ctx.fillStyle = '#FF4466';
    ctx.font = 'bold clamp(32px,7vw,42px) Inter, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', W / 2, cy);

    ctx.fillStyle = '#FFD447';
    ctx.font = 'bold clamp(24px,5vw,30px) Inter, system-ui, sans-serif';
    ctx.fillText(`Score ${score}`, W / 2, cy + 52);

    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.font = '14px Inter, system-ui, sans-serif';
    ctx.fillText(`Best ${bestScore}`, W / 2, cy + 82);

    const pa = 0.5 + Math.sin(menuPulse * 1.4) * 0.35;
    ctx.fillStyle = `rgba(255,255,255,${pa})`;
    ctx.font = 'bold 18px Inter, system-ui, sans-serif';
    ctx.fillText('Swipe to play again', W / 2, cy + 124);
  }

  /* ----------------------------- LOOP ----------------------------- */
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(2.2, (now - lastTime) / 16.667);
    lastTime = now;

    if (!isPaused) {
      update(dt);
      draw();
    }

    if (!firstFrameSent && !isPaused) {
      firstFrameSent = true;
      try { YT?.game?.firstFrameReady?.(); } catch (_) {}
      setTimeout(() => {
        if (!gameReadySent) {
          gameReadySent = true;
          try { YT?.game?.gameReady?.(); } catch (_) {}
        }
      }, 120);
    }

    requestAnimationFrame(loop);
  }

  /* ----------------------------- INPUT ----------------------------- */
  function onStart(e) {
    initAudio();
    if (isPaused) return;
    const p = eventPos(e);

    if (gameState === 'MENU') startRun();
    else if (gameState === 'OVER') { resetState(); startRun(); }

    if (gameState === 'PLAYING') {
      isSwiping = true;
      currentPath = [{ x: p.x, y: p.y }];
      slicedThisSwipe = [];
    }
  }

  function onMove(e) {
    if (!isSwiping || gameState !== 'PLAYING' || isPaused) return;
    const p = eventPos(e);
    const last = currentPath[currentPath.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) < 3) return;

    for (const s of shapes) {
      if (!s.alive || s.sliced) continue;
      if (distSeg(s.x, s.y, last.x, last.y, p.x, p.y) < s.r + 4) {
        s.sliced = true;
        s.alive = false;
        sliceShape(s);
      }
    }

    currentPath.push({ x: p.x, y: p.y });
    if (currentPath.length > 110) currentPath = currentPath.slice(-70);
  }

  function onEnd() {
    if (!isSwiping) return;
    isSwiping = false;
    if (currentPath.length >= 2) trails.push(new Trail(currentPath));
    if (gameState === 'PLAYING') resolveSwipe();
    currentPath = [];
    slicedThisSwipe = [];
    if (trails.length > 7) trails = trails.slice(-5);
  }

  function startRun() {
    gameState = 'PLAYING';
    shapes = []; particles = []; texts = []; trails = [];
    score = 0; misses = 0; difficulty = 1; bombChance = 0.08;
    spawnTimer = 0; shake = 0; comboStreak = 0; shieldActive = false; slowMo = 0;
    currentPath = []; slicedThisSwipe = []; isSwiping = false;
    toastTimer = 0; toast.className = ''; toast.textContent = '';
    comboMeter.style.display = 'none';
    updateScoreUI(); updateLivesUI();
    spawnWave();
  }

  function resetState() {
    shapes = []; particles = []; texts = []; trails = [];
    score = 0; misses = 0; difficulty = 1; bombChance = 0.08;
    spawnTimer = 0; shake = 0; comboStreak = 0; shieldActive = false; slowMo = 0;
    currentPath = []; slicedThisSwipe = []; isSwiping = false;
    toastTimer = 0; toast.className = ''; toast.textContent = '';
    comboMeter.style.display = 'none';
    updateScoreUI(); updateLivesUI();
  }

  /* Touch */
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(e); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(e); }, { passive: false });
  canvas.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); }, { passive: false });
  canvas.addEventListener('touchcancel', (e) => { e.preventDefault(); onEnd(); }, { passive: false });

  /* Mouse */
  canvas.addEventListener('mousedown', onStart);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);

  /* Prevent page scroll only on canvas (do not block Esc) */
  document.body.addEventListener('touchmove', (e) => {
    if (e.target === canvas) e.preventDefault();
  }, { passive: false });

  /* ----------------------------- INIT ----------------------------- */
  (async function boot() {
    initAudioState();
    initPauseHandlers();
    await initLanguage();
    await loadBest();
    updateScoreUI();
    updateLivesUI();
    updateBestUI();
    requestAnimationFrame(loop);

    if (IN_PLAYABLES) console.log('🎮 Swipe Slicer inside YouTube Playables');
    else console.log('🔪 Swipe Slicer standalone (SDK no-op)');
  })();
})();
</script>
</body>
</html>
